
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Expense Tracker | Daily Budget Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-lg p-6 space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">
        Expense Tracker <span class="text-blue-600 text-lg"></span>
      </h1>
      <div class="bg-blue-50 border border-blue-200 rounded-lg px-4 py-2 text-center">
        <div class="text-sm font-semibold text-gray-600">TOTAL TODAY</div>
        <div id="totalAmountDisplay" class="text-xl font-bold text-blue-700">$0.00</div>
      </div>
    </div>

    <!-- Form Panel -->
    <div class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Description</label>
          <input type="text" id="descInput" placeholder="e.g., Coffee, Lunch, Movie" autocomplete="off"
                 class="mt-1 w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Amount ($)</label>
          <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0"
                 class="mt-1 w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Category</label>
          <select id="categorySelect"
                  class="mt-1 w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <button id="addExpenseBtn"
              class="w-full bg-blue-600 text-white font-semibold py-2 rounded-md hover:bg-blue-700 transition">
        + Add Expense
      </button>
    </div>

    <!-- Actions Bar -->
    <div class="flex items-center justify-between border-t pt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Filter by category:</label>
        <select id="categoryFilter"
                class="mt-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
          <option value="ALL">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div id="expenseCountInfo" class="text-sm font-medium text-gray-600">0 expenses</div>
    </div>

    <!-- Expenses List -->
    <div id="expenseList" class="space-y-2">
      <!-- Empty state only -->
      <div class="text-center text-gray-400 italic">No expenses yet. Add your first expense above.</div>
    </div>

    
  </div>
</body>
</html>
